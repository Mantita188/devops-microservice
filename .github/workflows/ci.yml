name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-and-deploy:
    name: Tests, security and Docker deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      - name: Análisis de seguridad con Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::warning::SNYK_TOKEN no está configurado. Se omite Snyk; configura el secreto en GitHub para activar este análisis."
          else
            npx --yes snyk@latest test --severity-threshold=high
          fi

      - name: Construir imagen Docker
        run: docker compose build

      - name: Desplegar con Docker Compose
        run: docker compose up -d

      - name: Verificar estado del microservicio
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3000/health

      - name: Mostrar contenedores
        if: always()
        run: docker compose ps

      - name: Limpiar entorno de pruebas
        if: always()
        run: docker compose down